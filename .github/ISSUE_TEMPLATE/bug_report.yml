name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please do **not** report security problems here, see SECURITY.md instead.
        Never paste passwords, SMTP credentials or your `SECRET_KEY` into an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit, for example `1.0.0` or `latest`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Lootdrop?
      options:
        - Docker image from ghcr.io
        - Self-built Docker image
        - Locally with Python
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, with personal data removed
      render: text
