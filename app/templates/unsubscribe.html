{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto text-center py-20">
  {% if success %}
  <div class="text-6xl mb-4">✅</div>
  <h1 class="text-2xl font-bold text-white mb-2">{{ t('unsubscribe_title') }}</h1>
  <p class="text-gray-400">{{ t('unsubscribe_text') }}</p>
  {% else %}
  <div class="text-6xl mb-4">❌</div>
  <h1 class="text-2xl font-bold text-white mb-2">Fehler / Error</h1>
  <p class="text-gray-400">{{ t('unsubscribe_invalid') }}</p>
  {% endif %}
  <a href="/" class="mt-6 inline-block text-emerald-400 hover:underline text-sm">
    ← {{ t('nav_home') }}
  </a>
</div>

{% endblock %}
