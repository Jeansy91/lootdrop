<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('site_title') }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: '#10b981' } } }
    }
  </script>
  <style>
    input[type="checkbox"], input[type="radio"] {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; flex-shrink: 0;
      border: 1.5px solid rgba(255,255,255,0.12);
      background-color: #0f172a;
      cursor: pointer;
      transition: border-color .15s, background-color .15s;
      display: inline-block; vertical-align: middle;
    }
    input[type="checkbox"] { border-radius: 4px; }
    input[type="radio"]    { border-radius: 50%; }
    input[type="checkbox"]:hover, input[type="radio"]:hover { border-color: #10b981; }
    input[type="checkbox"]:checked {
      background-color: #059669; border-color: #059669;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 10 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 4L3.5 6.5L9 1' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: center; background-size: 10px 8px;
    }
    input[type="radio"]:checked {
      background-color: #059669; border-color: #059669;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 6 6' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='3' cy='3' r='2' fill='white'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: center; background-size: 6px 6px;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-gray-900/80 backdrop-blur-md border-b border-white/5 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between gap-4 h-14">

      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 shrink-0">
        <img src="/static/favicon.svg" class="w-6 h-6" alt="">
        <span class="font-extrabold text-base tracking-tight
                     bg-gradient-to-r from-emerald-400 to-emerald-300
                     bg-clip-text text-transparent">
          Lootdrop
        </span>
      </a>

      <div class="flex items-center gap-0.5 text-sm">
        <a href="/"
           class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors text-xs font-medium">
          {{ t('nav_home') }}
        </a>
        <a href="/subscribe"
           class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors text-xs font-medium">
          {{ t('nav_subscribe') }}
        </a>

        <div class="w-px h-4 bg-white/10 mx-2"></div>

        <!-- Language switcher -->
        <div class="flex gap-0.5 bg-gray-800 rounded-lg p-0.5">
          <a href="/?lang=de"
             class="text-xs px-2.5 py-1 rounded-md font-medium transition-colors
                    {% if lang == 'de' %}bg-emerald-600 text-white{% else %}text-gray-400 hover:text-white{% endif %}">
            DE
          </a>
          <a href="/?lang=en"
             class="text-xs px-2.5 py-1 rounded-md font-medium transition-colors
                    {% if lang == 'en' %}bg-emerald-600 text-white{% else %}text-gray-400 hover:text-white{% endif %}">
            EN
          </a>
        </div>
      </div>

    </div>
  </nav>

  <!-- Content -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-6 pt-0 pb-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/5 mt-auto">
    <div class="max-w-6xl mx-auto px-6 py-4 text-center text-gray-600 text-xs">
      {{ t('footer_powered') }}
      <a href="https://www.gamerpower.com" target="_blank" rel="noopener noreferrer"
         class="text-emerald-600 hover:text-emerald-400 transition-colors">GamerPower</a>
    </div>
  </footer>

  <!-- Confirm Modal -->
  <div id="modal-overlay"
       class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"
       onclick="if(event.target===this)closeModal()">
    <div class="bg-gray-900 border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <h3 id="modal-title" class="text-base font-semibold text-white mb-2"></h3>
      <p id="modal-message" class="text-sm text-gray-400 mb-6"></p>
      <div class="flex gap-3 justify-end">
        <button onclick="closeModal()"
                class="text-sm text-gray-400 hover:text-white transition-colors px-4 py-2 rounded-lg hover:bg-white/5">
          {{ t('common_cancel') }}
        </button>
        <button id="modal-confirm"
                class="text-sm px-4 py-2 rounded-lg font-medium transition-colors">
        </button>
      </div>
    </div>
  </div>
  <script>
    function toggleLangDd() {
      const panel   = document.getElementById('dd-lang-panel');
      const chevron = document.getElementById('lang-chevron');
      if (!panel) return;
      const isOpen = !panel.classList.contains('hidden');
      panel.classList.toggle('hidden', isOpen);
      chevron.classList.toggle('rotate-180', !isOpen);
    }

    function selectLang(value, label) {
      document.getElementById('lang-value').value = value;
      document.getElementById('lang-label').textContent = label;
      document.querySelectorAll('.lang-item').forEach(item => {
        const active = item.dataset.value === value;
        item.querySelector('.lang-check').classList.toggle('hidden', !active);
        item.querySelector('span').classList.toggle('text-white', active);
        item.querySelector('span').classList.toggle('text-gray-400', !active);
      });
      document.getElementById('dd-lang-panel').classList.add('hidden');
      document.getElementById('lang-chevron').classList.remove('rotate-180');
    }

    document.addEventListener('click', e => {
      const dd = document.getElementById('dd-lang');
      if (dd && !e.target.closest('#dd-lang')) {
        document.getElementById('dd-lang-panel').classList.add('hidden');
        document.getElementById('lang-chevron').classList.remove('rotate-180');
      }
    });

    function showModal(title, message, confirmText, confirmCls, onConfirm) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      const btn = document.getElementById('modal-confirm');
      btn.textContent = confirmText;
      btn.className = 'text-sm px-4 py-2 rounded-lg font-medium transition-colors ' + confirmCls;
      btn.onclick = function() { closeModal(); onConfirm(); };
      document.getElementById('modal-overlay').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
