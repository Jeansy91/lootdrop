{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-bold text-white mb-1">{{ t('subscribe_title') }}</h1>
  <p class="text-gray-400 mb-6">{{ t('subscribe_subtitle') }}</p>

  {% if message %}
  <div class="mb-5 px-4 py-3 rounded-lg text-sm
              {% if error %}bg-red-900/50 border border-red-600 text-red-300
              {% else %}bg-emerald-900/50 border border-emerald-600 text-emerald-300{% endif %}">
    {{ message }}
  </div>
  {% endif %}

  <form method="post" action="/subscribe" class="space-y-5">

    <!-- E-Mail -->
    <div>
      <label class="block text-sm text-gray-300 mb-1">
        {{ t('subscribe_email_label') }}
      </label>
      <input type="email" name="email" required autocomplete="email"
             class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2
                    text-white placeholder-gray-500 focus:border-emerald-500 focus:outline-none">
    </div>

    <!-- Sprache -->
    <div>
      <label class="block text-sm text-gray-300 mb-1">
        {{ t('subscribe_lang_label') }}
      </label>
      <select name="language"
              class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2
                     text-white focus:border-emerald-500 focus:outline-none">
        <option value="de" {% if lang == 'de' %}selected{% endif %}>{{ t('lang_de') }}</option>
        <option value="en" {% if lang == 'en' %}selected{% endif %}>{{ t('lang_en') }}</option>
      </select>
    </div>

    <!-- Plattformen -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="text-sm text-gray-300">{{ t('subscribe_platforms_label') }}</label>
        <button type="button" onclick="toggleAll()"
                class="text-xs text-emerald-400 hover:text-emerald-300">
          {{ t('platforms_all') }}
        </button>
      </div>
      <div class="bg-gray-800 border border-gray-600 rounded-lg p-3 space-y-2">
        {% for group in platform_groups %}
        <label class="flex items-center gap-3 cursor-pointer group">
          <input type="checkbox" name="platforms" value="{{ group }}"
                 {% if group in selected_platforms %}checked{% endif %}
                 class="platform-cb w-4 h-4 rounded border-gray-500 bg-gray-700
                        text-emerald-500 focus:ring-emerald-500 focus:ring-offset-gray-900">
          <span class="text-sm text-gray-300 group-hover:text-white transition-colors">
            {{ group }}
          </span>
        </label>
        {% endfor %}
      </div>
      <p class="text-xs text-gray-500 mt-1">{{ t('subscribe_platforms_hint') }}</p>
    </div>

    <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium
                   py-2 rounded-lg transition-colors">
      {{ t('subscribe_btn') }}
    </button>
  </form>
</div>

<script>
  function toggleAll() {
    const boxes = document.querySelectorAll('.platform-cb');
    const allChecked = [...boxes].every(b => b.checked);
    boxes.forEach(b => b.checked = !allChecked);
  }
</script>

{% endblock %}
