<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Free Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm px-4">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🎮</div>
      <h1 class="text-2xl font-bold text-white">{{ t('admin_login_title') }}</h1>
    </div>

    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-lg bg-red-900/50 border border-red-600
                text-red-300 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login"
          class="bg-gray-800 rounded-xl p-6 space-y-4 border border-gray-700">
      <div>
        <label class="block text-sm text-gray-300 mb-1">{{ t('admin_username') }}</label>
        <input type="text" name="username" required autofocus autocomplete="username"
               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2
                      text-white focus:border-emerald-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">{{ t('admin_password') }}</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2
                      text-white focus:border-emerald-500 focus:outline-none">
      </div>
      <button type="submit"
              class="w-full bg-emerald-600 hover:bg-emerald-500 text-white
                     font-medium py-2 rounded-lg transition-colors">
        {{ t('admin_login_btn') }}
      </button>
    </form>
  </div>

</body>
</html>
