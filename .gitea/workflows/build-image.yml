name: Build Image

# Veröffentlicht das Image in die Gitea-Registry, damit der lootdrop-Stack es
# zieht statt auf dem Docker-Host zu bauen.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: gitea.example.com
  OWNER: jens

jobs:
  # Das Projekt hat keine Testsuite. Dieser Job ist bewusst kein Ersatz
  # dafür, sondern fängt nur das Offensichtliche ab: Syntaxfehler und
  # kaputte Importe würden sonst erst beim Start des Containers auffallen,
  # also nach dem Push von :latest.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --no-cache-dir -r requirements.txt

      - name: Syntaxprüfung
        run: python -m compileall -q app

      - name: App importieren
        # database.py legt beim Import das Verzeichnis der SQLite-Datei an;
        # der Default /data existiert im Runner nicht.
        env:
          DATABASE_PATH: ./ci-data/lootdrop.db
        run: python -c "from app.main import app; print(app.title)"

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Nicht secrets.GITEA_TOKEN: der pro Task eingespeiste Token
      # authentifiziert gegen die API, wird von der Container-Registry aber
      # abgelehnt (/v2/ liefert unauthorized). Nötig ist ein persönlicher
      # Access Token mit write:package als Repo-Secret REGISTRY_TOKEN.
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Bei einem v*-Tag bekommt das Image zusätzlich die nackte Version, damit
      # im Registry-Listing ohne SHA-Auflösung erkennbar ist, was läuft.
      - name: Derive image tags
        id: meta
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.OWNER }}/lootdrop"
          {
            echo "tags<<TAGS_EOF"
            echo "$REPO:${{ gitea.sha }}"
            echo "$REPO:latest"
            if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
              echo "$REPO:${GITHUB_REF#refs/tags/v}"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      Dockerfile
          platforms: linux/amd64
          push:      true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
